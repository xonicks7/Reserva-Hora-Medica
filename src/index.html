<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Horas Médicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Centro Médico Salud</h1>
            <p>Reserva tu hora médica</p>
        </header>

        <form>
            <h2>Datos de la reserva</h2>

            <label for="nombre">Nombre del paciente</label>
            <input type="text" id="nombre"
                   placeholder="Ejemplo: Paciente Demo" required>

            <label for="especialidad">Especialidad médica</label>
            <select id="especialidad" required>
                <option value="">Selecciona una especialidad</option>
                <option>Medicina General</option>
                <option>Odontología</option>
                <option>Cardiología</option>
                <option>Pediatría</option>
                <option>Dermatología</option>
            </select>

            <label for="fecha">Fecha de atención</label>
            <input type="date" id="fecha" required>

            <label for="hora">Hora de atención</label>
            <select id="hora" required>
                <option value="">Selecciona una hora</option>
                <option>09:00</option>
                <option>10:00</option>
                <option>11:00</option>
                <option>12:00</option>
                <option>15:00</option>
                <option>16:00</option>
            </select>

            <button type="submit">Reservar hora</button>
        </form>

        <footer>
            <p>Proyecto académico DevOps - Datos ficticios</p>
        </footer>
    </main>

</body>
</html>
